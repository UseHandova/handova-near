[package]
name = "handova"
description = "Handova rent escrow on NEAR: rent waits in escrow until move-in, and the lease NFT holds the caution fee."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UseHandova/handova-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
base64 = "0.22"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
